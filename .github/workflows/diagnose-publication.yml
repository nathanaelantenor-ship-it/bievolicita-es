name: Diagnostico URL publica Bievo
on:
  push:
    branches:
      - diagnostic/verificar-publicacao-whatsapp-sisto
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar dominio publico com cache desabilitado
        run: node scripts/diagnose-publication.mjs
