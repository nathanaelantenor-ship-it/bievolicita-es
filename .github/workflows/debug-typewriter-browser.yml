name: Diagnóstico navegador real - digitação
on:
  push:
    branches:
      - fix/typewriter-browser-e2e
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-typewriter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright e Chrome
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Abrir Bievo desktop e mobile e inspecionar 3 títulos
        run: node scripts/typewriter-browser-e2e.mjs
